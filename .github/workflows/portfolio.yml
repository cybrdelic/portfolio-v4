name: Portfolio visual and performance checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-test-results
          path: test-results/
          retention-days: 14
